<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benjamin Munashe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#24376b;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    max-width:900px;
    width:100%;
    text-align:center;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,0.05);
}

h1{
    font-size:clamp(3rem,8vw,5rem);
    margin-bottom:15px;
}

.subtitle{
    font-size:1.6rem;
    margin-bottom:40px;
}

.description{
    font-size:1.4rem;
    line-height:1.8;
    margin-bottom:40px;
}

.date{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:15px 25px;
    border-radius:15px;
    font-size:1.1rem;
    font-weight:bold;
    min-width:300px;
}
</style>
</head>

<body>

<div class="container">

<h1>Benjamin</h1>

<div class="subtitle">
MSc student, National College of Ireland
</div>

<div class="description">
I care about helping businesses solve decision-making challenges using data analytics, customer insights and evidence-based strategies that improve performance and growth.
</div>

<div class="date" id="date">
Loading today's date...
</div>

</div>

<script>
window.onload = function () {
    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        "Today's Date: " +
        new Date().toLocaleDateString("en-IE", options);
};
</script>

</body>
</html>
